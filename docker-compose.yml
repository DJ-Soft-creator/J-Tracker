name: journaling-tracker

services:
  journaling-tracker:
    build: .
    image: journaling-tracker:latest
    container_name: journaling-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-4097}:4098"
    env_file:
      - /docker-storage/my_Journal_data/data/journals/.env
    volumes:
      - ${JOURNAL_DATA_DIR:-/docker-storage/my_Journal_data/data/journals/}:/app/data
    environment:
      - TZ=Europe/Berlin
      - DATA_DIR=/app/data
      - ENVIRONMENT=prod
    user: "1000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4098/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  family-scheduler:
    build: .
    image: journaling-tracker:latest
    container_name: journaling-tracker-scheduler
    restart: unless-stopped
    env_file:
      - /docker-storage/my_Journal_data/data/journals/.env
    volumes:
      - ${JOURNAL_DATA_DIR:-/docker-storage/my_Journal_data/data/journals/}:/app/data
    environment:
      - TZ=Europe/Berlin
      - DATA_DIR=/app/data
      - ENVIRONMENT=prod
    user: "1000"
    command: ["python", "/app/scripts/scheduler.py", "--loop"]

  whisper:
    profiles: ["whisper"]
    build: ./whisper_service
    image: journl-whisper:latest
    container_name: journl-whisper
    restart: unless-stopped
    env_file:
      - /docker-storage/my_Journal_data/data/journals/.env
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_CPU_THREADS=${WHISPER_CPU_THREADS:-4}
    ports:
      - "${WHISPER_PORT:-8090}:8090"
    volumes:
      - whisper-models:/models

  whisper-scheduler:
    profiles: ["whisper"]
    image: journaling-tracker:latest
    container_name: journl-whisper-scheduler
    restart: unless-stopped
    user: "1000"
    depends_on: [whisper]
    env_file:
      - /docker-storage/my_Journal_data/data/journals/.env
    volumes:
      - ${JOURNAL_DATA_DIR:-/docker-storage/my_Journal_data/data/journals/}:/app/data
    environment:
      - TZ=Europe/Berlin
      - DATA_DIR=/app/data
      - WHISPER_URL=http://whisper:8090
      - WHISPER_SCHEDULE_HOUR=${WHISPER_SCHEDULE_HOUR:-11}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-de}
    command: ["python", "/app/scripts/whisper-scheduler.py", "--loop"]

volumes:
  whisper-models:
